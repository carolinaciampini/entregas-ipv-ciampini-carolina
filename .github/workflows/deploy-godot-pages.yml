name: Exportar y publicar Entrega 5

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.7.2"
  PROJECT_PATH: "entrega-5-ciampini-carolina"
  WEB_PATH: "entrega-5-ciampini-carolina"

jobs:
  build:
    name: Exportar juego para Web
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:4.7.2
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v6

      - name: Preparar plantillas de exportación
        shell: bash
        run: |
          mkdir -p "$HOME/.local/share/godot/export_templates"
          if [ "$HOME" != "/root" ]; then
            cp -R "/root/.local/share/godot/export_templates/${GODOT_VERSION}.stable" \
              "$HOME/.local/share/godot/export_templates/"
          fi

      - name: Preparar sitio conservando las entregas anteriores
        shell: bash
        run: |
          mkdir -p public
          tar --exclude='./.git' --exclude='./.github' --exclude='./public' -cf - . \
            | tar -xf - -C public

      - name: Exportar Godot a HTML5
        shell: bash
        run: |
          mkdir -p "public/${WEB_PATH}"
          godot --headless --verbose \
            --path "$PROJECT_PATH" \
            --export-release "Web" \
            "$GITHUB_WORKSPACE/public/${WEB_PATH}/index.html"

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Subir artefacto de GitHub Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

  deploy:
    name: Publicar en GitHub Pages
    runs-on: ubuntu-24.04
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar sitio
        id: deployment
        uses: actions/deploy-pages@v4
