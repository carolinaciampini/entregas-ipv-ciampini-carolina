name: Generar export Web de Entrega 5

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  PROJECT_PATH: entrega-5-ciampini-carolina

jobs:
  exportar:
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:4.7.2

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v6

      - name: Preparar plantillas de exportación
        shell: bash
        run: |
          mkdir -p "$HOME/.local/share/godot/export_templates"
          if [ -d "/root/.local/share/godot/export_templates" ]; then
            cp -R /root/.local/share/godot/export_templates/. "$HOME/.local/share/godot/export_templates/"
          fi

      - name: Exportar juego para Web
        shell: bash
        run: |
          godot --headless --verbose --path "$PROJECT_PATH" --export-release "Web" "$GITHUB_WORKSPACE/$PROJECT_PATH/index.html"

      - name: Guardar la exportación en main
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$PROJECT_PATH"
          if git diff --cached --quiet; then
            echo "La exportación ya está actualizada."
            exit 0
          fi
          git commit -m "Agregar export Web de Entrega 5"
          git push origin HEAD:main
