name: Exportación temporal de Entrega 5

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  exportar:
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:4.7.2

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v6

      - name: Preparar plantillas de exportación
        shell: bash
        run: |
          mkdir -p "$HOME/.local/share/godot/export_templates"
          if [ -d "/root/.local/share/godot/export_templates" ]; then
            cp -R /root/.local/share/godot/export_templates/. "$HOME/.local/share/godot/export_templates/"
          fi

      - name: Exportar juego para Web
        shell: bash
        run: |
          mkdir -p "$GITHUB_WORKSPACE/export"
          godot --headless --verbose --path entrega-5-ciampini-carolina --export-release "Web" "$GITHUB_WORKSPACE/export/index.html"

      - name: Subir exportación temporal
        uses: actions/upload-artifact@v4
        with:
          name: entrega-5-web
          path: export/
          retention-days: 1
